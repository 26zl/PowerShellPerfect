name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners are Windows Server images; Windows 10/11 client behaviour is verified manually (see CONTRIBUTING.md).
# The runner image is pinned instead of windows-latest so an image upgrade cannot change results unnoticed.
jobs:
  lint:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Windows runners support audit mode only (block mode needs a Linux runner), so egress is logged, not blocked.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer (PSScriptAnalyzerSettings.psd1)
        shell: pwsh
        # tests/ is excluded: those files call profile aliases (gc, ls, cat, uptime, eventlog) by their short names to
        # exercise the profile's own definitions, and hold fixtures that trip the secret and path scanners.
        run: pwsh -NoProfile -File tests/lint.ps1 -NoInstall

      - name: Smoke-test profile (PS7, sandboxed, load-time budget)
        shell: pwsh
        run: pwsh -NoProfile -File tests/smoke.ps1 -BudgetMs 3000

      - name: PS5 parse-check (all .ps1 files)
        shell: powershell
        run: |
          Write-Host "PS5 version: $($PSVersionTable.PSVersion)" -ForegroundColor Cyan
          $errors = 0
          $files = Get-ChildItem -Path '${{ github.workspace }}' -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "FAIL: $($file.FullName)" -ForegroundColor Red
              foreach ($pe in $parseErrors) {
                Write-Host "  Line $($pe.Extent.StartLineNumber) Col $($pe.Extent.StartColumnNumber): $($pe.Message)" -ForegroundColor Red
                Write-Host "  Text: $($pe.Extent.Text)" -ForegroundColor Yellow
              }
              $errors++
            } else {
              Write-Host "OK: $($file.Name)" -ForegroundColor Green
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: Smoke-test profile (PS5.1 runtime, sandboxed, load-time budget)
        shell: powershell
        run: powershell -NoProfile -File tests/smoke.ps1 -BudgetMs 4000

      - name: Check for hardcoded paths
        shell: pwsh
        run: |
          # Regex patterns for matching hardcoded user paths (used directly with -match, no extra escaping)
          $patterns = @(
            'C:\\Users\\'
            'C:/Users/'
            '/home/'
            '\\\\Users\\\\'
          )
          # tests/test.ps1 replicates this same check locally, so it contains the regex patterns
          # we are searching for; excluded by name to avoid self-matching.
          $files = Get-ChildItem -Recurse -Include *.ps1 | Where-Object { $_.FullName -notlike '*\.git\*' -and $_.Name -ne 'test.ps1' }
          $found = @()
          foreach ($file in $files) {
            $lines = Get-Content $file.FullName -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt $lines.Count; $i++) {
              foreach ($pattern in $patterns) {
                if ($lines[$i] -match $pattern) {
                  $found += [PSCustomObject]@{
                    File = $file.Name
                    Line = $i + 1
                    Match = $lines[$i].Trim()
                  }
                }
              }
            }
          }
          if ($found) {
            $found | Format-Table -AutoSize
            Write-Error "Hardcoded user paths found"
            exit 1
          }
          Write-Host "No hardcoded paths found." -ForegroundColor Green

      - name: Check for non-ASCII characters in scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path '${{ github.workspace }}' -Include *.ps1,*.psd1 -Recurse
          $found = @()
          foreach ($file in $files) {
            $lines = Get-Content $file.FullName -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '[^\x00-\x7E]') {
                $found += [PSCustomObject]@{
                  File = $file.Name
                  Line = $i + 1
                  Match = $lines[$i].Trim()
                }
              }
            }
          }
          if ($found) {
            $found | Format-Table -AutoSize
            Write-Error "Non-ASCII characters found in .ps1 files (em dashes, smart quotes, etc. break PS5)"
            exit 1
          }
          Write-Host "No non-ASCII characters found." -ForegroundColor Green

      - name: Check for UTF-8 BOM
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psd1,*.json | Where-Object { $_.FullName -notlike '*\.git\*' }
          $found = @()
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $found += $file.Name
            }
          }
          if ($found) {
            $found | ForEach-Object { Write-Host "BOM found: $_" -ForegroundColor Red }
            Write-Error "UTF-8 BOM detected. Use [System.IO.File]::WriteAllText() with UTF8Encoding(false)"
            exit 1
          }
          Write-Host "No UTF-8 BOM found." -ForegroundColor Green

      - name: Check for Set-Content -Encoding UTF8
        shell: pwsh
        run: |
          # tests/test.ps1 replicates this scan and contains the regex itself; excluded by name.
          $files = Get-ChildItem -Recurse -Include *.ps1 | Where-Object { $_.FullName -notlike '*\.git\*' -and $_.Name -ne 'test.ps1' }
          $found = @()
          foreach ($file in $files) {
            $lines = Get-Content $file.FullName -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'Set-Content\s.*-Encoding\s+UTF8' -and $lines[$i] -notmatch '^\s*#') {
                $found += [PSCustomObject]@{
                  File = $file.Name
                  Line = $i + 1
                  Match = $lines[$i].Trim()
                }
              }
            }
          }
          if ($found) {
            $found | Format-Table -AutoSize
            Write-Error "Set-Content -Encoding UTF8 writes BOM on PS5. Use [System.IO.File]::WriteAllText() instead"
            exit 1
          }
          Write-Host "No Set-Content -Encoding UTF8 found." -ForegroundColor Green

      - name: Check for secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(?i)(api[_-]?key|apikey)\s*[:=]\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
            '(?i)(secret|token|password)\s*[:=]\s*[''"][^''"]{8,}[''"]'
            '(?i)(aws_access_key_id|aws_secret_access_key)\s*[:=]'
            'ghp_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{82}'
            'sk-[A-Za-z0-9]{32,}'
            '(?i)connectionstring\s*[:=]\s*[''"]Server='
          )
          # tests/test.ps1 contains secret-detection regex patterns locally; excluded by name.
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psd1,*.md,*.yml,*.json | Where-Object { $_.FullName -notlike '*\.git\*' -and $_.FullName -notlike '*\.github\workflows\*' -and $_.Name -ne 'test.ps1' }
          $found = @()
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            if (-not $content) { continue }
            foreach ($pattern in $patterns) {
              if ($content -match $pattern) {
                $found += [PSCustomObject]@{
                  File = $file.Name
                  Pattern = $pattern.Substring(0, [Math]::Min(40, $pattern.Length)) + '...'
                }
              }
            }
          }
          if ($found) {
            $found | Format-Table -AutoSize
            Write-Error "Potential secrets found"
            exit 1
          }
          Write-Host "No secrets found." -ForegroundColor Green

  install-flow:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Windows runners support audit mode only (block mode needs a Linux runner), so egress is logged, not blocked.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON configs parse correctly
        shell: pwsh
        run: |
          $errors = 0
          foreach ($file in @('theme.json', 'terminal-config.json')) {
            try {
              $null = Get-Content $file -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
              Write-Host "OK: $file" -ForegroundColor Green
            } catch {
              Write-Host "FAIL: $file - $_" -ForegroundColor Red
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: Validate config schema (required keys and pins)
        shell: pwsh
        run: |
          $theme = Get-Content 'theme.json' -Raw | ConvertFrom-Json
          $terminal = Get-Content 'terminal-config.json' -Raw | ConvertFrom-Json
          $errors = @()
          if (-not $theme.theme.name) { $errors += 'theme.json: missing theme.name' }
          if (-not $theme.theme.url) { $errors += 'theme.json: missing theme.url' }
          if ($theme.theme.url -match '/main/') { $errors += 'theme.json: theme.url follows a branch instead of a release tag' }
          if ($theme.theme.sha256 -notmatch '^[A-Fa-f0-9]{64}$') { $errors += 'theme.json: theme.sha256 missing or malformed' }
          if (-not $terminal.defaults) { $errors += 'terminal-config.json: missing defaults' }
          if (-not $terminal.fontInstall) { $errors += 'terminal-config.json: missing fontInstall' }
          if (-not $terminal.fontInstall.name) { $errors += 'terminal-config.json: missing fontInstall.name' }
          if (-not $terminal.fontInstall.displayName) { $errors += 'terminal-config.json: missing fontInstall.displayName' }
          if ($terminal.fontInstall.version -notmatch '^\d+\.\d+\.\d+$') { $errors += 'terminal-config.json: fontInstall.version missing or not x.y.z' }
          if ($terminal.fontInstall.sha256 -notmatch '^[A-Fa-f0-9]{64}$') { $errors += 'terminal-config.json: fontInstall.sha256 missing or malformed' }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "FAIL: $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host "Config schema valid." -ForegroundColor Green

      - name: Validate wizard curated data (CuratedSchemes + CuratedFonts)
        shell: pwsh
        run: |
          . ./tests/lib/Sandbox.ps1
          . ([scriptblock]::Create((Get-PspAssignmentSource -Path 'setup.ps1' -Variable '$script:CuratedSchemes')))
          . ([scriptblock]::Create((Get-PspAssignmentSource -Path 'setup.ps1' -Variable '$script:CuratedFonts')))
          $errors = 0
          # Schemes: expect 7 entries, each with Name, Desc, and a nested Scheme with name + background
          $schemes = $script:CuratedSchemes
          if ($schemes.Count -ne 7) { Write-Host "FAIL: expected 7 curated schemes, got $($schemes.Count)" -ForegroundColor Red; $errors++ }
          $schemeInnerReq = @('name','background','foreground','black','red','green','yellow','blue','purple','cyan','white')
          foreach ($s in $schemes) {
            foreach ($k in 'Name', 'Desc', 'Scheme') {
              if (-not $s.ContainsKey($k)) { Write-Host "FAIL: scheme '$($s.Name)' missing '$k'" -ForegroundColor Red; $errors++ }
            }
            if ($s.Scheme) {
              foreach ($k in $schemeInnerReq) {
                if (-not $s.Scheme.ContainsKey($k)) { Write-Host "FAIL: scheme '$($s.Name)' missing Scheme.$k" -ForegroundColor Red; $errors++ }
              }
              if ($s.Scheme.background -and $s.Scheme.background -notmatch '^#[0-9a-fA-F]{6}$') {
                Write-Host "FAIL: scheme '$($s.Name)' background not a #RRGGBB hex: $($s.Scheme.background)" -ForegroundColor Red; $errors++
              }
            }
          }
          Write-Host "OK: $($schemes.Count) curated schemes validated" -ForegroundColor Green
          # Fonts: expect 6 entries, each with the menu label, release asset, display name, description and pinned hash
          $fonts = $script:CuratedFonts
          if ($fonts.Count -ne 6) { Write-Host "FAIL: expected 6 curated fonts, got $($fonts.Count)" -ForegroundColor Red; $errors++ }
          foreach ($f in $fonts) {
            foreach ($k in 'Name', 'Asset', 'DisplayName', 'Desc', 'Sha256') {
              if (-not $f.ContainsKey($k) -or [string]::IsNullOrWhiteSpace([string]$f[$k])) {
                Write-Host "FAIL: font '$($f.Asset)' missing '$k'" -ForegroundColor Red; $errors++
              }
            }
            if ($f.Sha256 -notmatch '^[A-F0-9]{64}$') { Write-Host "FAIL: font '$($f.Asset)' hash malformed" -ForegroundColor Red; $errors++ }
          }
          Write-Host "OK: $($fonts.Count) curated fonts validated" -ForegroundColor Green
          if ($errors -gt 0) { exit 1 }

      - name: setup.ps1 structure (copies match the profile, verification before changes)
        shell: pwsh
        run: |
          . ./tests/lib/Sandbox.ps1
          $problems = @()
          $setup = Get-Content 'setup.ps1' -Raw
          foreach ($fn in 'Test-InternetConnection', 'Install-NerdFonts', 'Install-OhMyPoshTheme', 'Install-WingetPackage', 'Select-PreferredEditor', 'Remove-SafeTempDirectory', 'Initialize-InstallBundle', 'Save-WizardChoices', 'Resolve-WizardState', 'Invoke-SetupInstall') {
            if ($setup -notmatch "function\s+$fn\b") { $problems += "missing function $fn" }
          }
          # setup.ps1 needs these before the bundle is verified, so it carries copies that must match the profile exactly.
          foreach ($fn in 'Write-PspHost', 'Invoke-DownloadWithRetry', 'Get-CombinedSha256', 'Resolve-PspCommitSha', 'Get-PspReleaseChecksums') {
            $a = (Get-PspFunctionSource -Path 'setup.ps1' -Name $fn) -replace "`r`n", "`n"
            $b = (Get-PspFunctionSource -Path 'Microsoft.PowerShell_profile.ps1' -Name $fn) -replace "`r`n", "`n"
            if ($a -cne $b) { $problems += "$fn in setup.ps1 differs from the profile" }
          }
          # Everything else setup.ps1 loads from the verified profile must exist there.
          . ([scriptblock]::Create((Get-PspAssignmentSource -Path 'setup.ps1' -Variable '$script:SharedFunctionNames')))
          try { $null = Get-PspFunctionSource -Path 'Microsoft.PowerShell_profile.ps1' -Name $script:SharedFunctionNames } catch { $problems += $_.Exception.Message }
          if ($setup.IndexOf('$script:Bundle = Initialize-InstallBundle') -gt $setup.IndexOf('$installed = Invoke-SetupInstall')) { $problems += 'bundle verification does not come before installation' }
          if ($problems) { $problems | ForEach-Object { Write-Host "FAIL: $_" -ForegroundColor Red }; exit 1 }
          Write-Host 'setup.ps1 structure OK' -ForegroundColor Green

      - name: Regression tests (PS7, tests/unit.ps1)
        shell: pwsh
        run: pwsh -NoProfile -File tests/unit.ps1 -AllowElevated

      - name: Regression tests (PS5.1, tests/unit.ps1)
        shell: powershell
        run: powershell -NoProfile -File tests/unit.ps1 -AllowElevated

  functional:
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [lint, install-flow]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Windows runners support audit mode only (block mode needs a Linux runner), so egress is logged, not blocked.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run functional profile tests (third-party endpoints mocked)
        shell: pwsh
        run: pwsh -NoProfile -File '${{ github.workspace }}/tests/ci-functional.ps1' -AllowElevated
